name: Update French translation for PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: french-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  update-french:
    name: Translate and update French files
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Do not expose POEditor credentials to pull requests from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository

    env:
      POEDITOR_PROJECT_ID: ${{ secrets.POEDITOR_PROJECT_ID }}
      POEDITOR_API_TOKEN: ${{ secrets.POEDITOR_API_TOKEN }}
      POEDITOR_SOURCE_LANGUAGE: en
      POEDITOR_TARGET_LANGUAGE: fr
      POEDITOR_TRANSLATION_PROVIDER: deepl

    steps:
      - name: Check out the pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            gettext \
            git \
            pandoc

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Fetch notebooks and install tools
        run: make buildtools

      - name: Build English translation terms
        run: |
          rm -rf _build/gettext

          python -m sphinx \
            -E \
            -a \
            -T \
            -b gettext \
            . \
            _build/gettext

      - name: Merge POT files
        shell: bash
        run: |
          mapfile -d '' POT_FILES < <(
            find _build/gettext \
              -type f \
              -name "*.pot" \
              -print0 |
            sort -z
          )

          if [ "${#POT_FILES[@]}" -eq 0 ]; then
            echo "No POT files were generated."
            exit 1
          fi

          msgcat \
            --use-first \
            --output-file=_build/docs.pot \
            "${POT_FILES[@]}"

          test -s _build/docs.pot

      - name: Upload English terms to POEditor
        run: python upload_terms.py

      - name: Automatically translate empty French terms
        run: python automatic_translate.py

      - name: Download French translations
        run: python download_translations.py

      - name: Verify French translation file
        run: |
          test -f locales/fr/LC_MESSAGES/docs.po

      - name: Commit updated French translations
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add locales/fr/LC_MESSAGES

          if git diff --cached --quiet; then
            echo "No French translation changes were found."
            exit 0
          fi

          git commit -m "Update French translations for PR"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
