name: Update French translations for PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: french-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  update-french:
    name: Update and validate French documentation
    runs-on: ubuntu-latest
    timeout-minutes: 40

    # Run manually, or for PRs created from branches in this repository.
    # Skip the second run created by the workflow's own bot commit.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'github-actions[bot]'
      )

    env:
      POEDITOR_PROJECT_ID: ${{ secrets.POEDITOR_PROJECT_ID }}
      POEDITOR_API_TOKEN: ${{ secrets.POEDITOR_API_TOKEN }}

    steps:
      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Check out pull-request branch
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Check out selected branch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      # ------------------------------------------------------
      # Environment
      # ------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install --yes \
            gettext \
            git \
            pandoc

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify POEditor secrets
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${POEDITOR_PROJECT_ID:-}" ]; then
            echo "::error::POEDITOR_PROJECT_ID is not configured."
            exit 1
          fi

          if [ -z "${POEDITOR_API_TOKEN:-}" ]; then
            echo "::error::POEDITOR_API_TOKEN is not configured."
            exit 1
          fi

      # ------------------------------------------------------
      # Documentation preparation
      # ------------------------------------------------------

      - name: Fetch notebooks and install tools
        shell: bash
        run: |
          set -euo pipefail
          make buildtools

      # ------------------------------------------------------
      # Generate English translation terms
      # ------------------------------------------------------

      - name: Build Sphinx gettext catalogues
        shell: bash
        env:
          GITHUB_ACTIONS: "True"
        run: |
          set -euo pipefail

          rm -rf _build/gettext
          mkdir -p _build/gettext

          python -m sphinx \
            -E \
            -a \
            -T \
            -b gettext \
            . \
            _build/gettext

      - name: Verify generated POT files
        shell: bash
        run: |
          set -euo pipefail

          echo "Generated POT files:"

          find _build/gettext \
            -type f \
            -name "*.pot" \
            -print

          if ! find _build/gettext \
            -type f \
            -name "*.pot" \
            -print -quit |
            grep -q .; then
            echo "::error::No POT files were generated."
            exit 1
          fi

      - name: Merge POT files
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' POT_FILES < <(
            find _build/gettext \
              -type f \
              -name "*.pot" \
              -print0 |
            sort -z
          )

          if [ "${#POT_FILES[@]}" -eq 0 ]; then
            echo "::error::No POT files were available for merging."
            exit 1
          fi

          msgcat \
            --use-first \
            --output-file=_build/docs.pot \
            "${POT_FILES[@]}"

          if [ ! -s "_build/docs.pot" ]; then
            echo "::error::The merged POT file is empty."
            exit 1
          fi

          echo "Merged translation catalogue:"
          ls -lh _build/docs.pot

      - name: Upload English terms to POEditor
        shell: bash
        run: |
          set -euo pipefail
          python upload_terms.py

      # ------------------------------------------------------
      # Download French translations
      # ------------------------------------------------------

      - name: Download French translations
        shell: bash
        run: |
          set -euo pipefail
          make fetchtranslation

      - name: Verify downloaded French PO files
        shell: bash
        run: |
          set -euo pipefail

          echo "Downloaded French translation files:"

          find locales/fr/LC_MESSAGES \
            -type f \
            -name "*.po" \
            -print

          if ! find locales/fr/LC_MESSAGES \
            -type f \
            -name "*.po" \
            -print -quit |
            grep -q .; then
            echo "::error::No French PO files were downloaded."
            exit 1
          fi

      # ------------------------------------------------------
      # Repair and validate French PO files
      # ------------------------------------------------------

      - name: Normalise French PO files
        shell: bash
        run: |
          set -euo pipefail
          python normalize_po_files.py

      - name: Validate French PO files
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' PO_FILES < <(
            find locales/fr/LC_MESSAGES \
              -type f \
              -name "*.po" \
              -print0 |
            sort -z
          )

          if [ "${#PO_FILES[@]}" -eq 0 ]; then
            echo "::error::No French PO files were found."
            exit 1
          fi

          for po_file in "${PO_FILES[@]}"; do
            echo "Checking ${po_file}"

            msgfmt \
              --check \
              --check-format \
              --output-file=/dev/null \
              "${po_file}"
          done

          echo "All French PO files are valid."

      # ------------------------------------------------------
      # Compile and build French documentation
      # ------------------------------------------------------

      - name: Compile French translation catalogues
        shell: bash
        run: |
          set -euo pipefail

          python -m sphinx_intl build \
            --locale-dir locales \
            --language fr

      - name: Build French documentation
        shell: bash
        env:
          READTHEDOCS_LANGUAGE: fr
        run: |
          set -euo pipefail

          rm -rf _build/html/fr

          python -m sphinx \
            -E \
            -a \
            -T \
            -b html \
            -D language=fr \
            . \
            _build/html/fr

      - name: Verify French HTML build
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "_build/html/fr/index.html" ]; then
            echo "::error::French index.html was not generated."
            exit 1
          fi

          echo "French documentation built successfully:"
          echo "_build/html/fr/index.html"

      # ------------------------------------------------------
      # Commit updated translations to the PR
      # ------------------------------------------------------

      - name: Commit French translations to PR branch
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add locales/fr/LC_MESSAGES

          if git diff --cached --quiet; then
            echo "No French translation changes were found."
            exit 0
          fi

          git commit \
            -m "Update French translations for PR"

          git push origin "HEAD:${PR_BRANCH}"

      # ------------------------------------------------------
      # Save temporary preview
      # ------------------------------------------------------

      - name: Upload French HTML preview
        uses: actions/upload-artifact@v7
        with:
          name: french-documentation-preview-${{ github.event.pull_request.number || github.run_number }}
          path: _build/html/fr
          if-no-files-found: error
          retention-days: 7
