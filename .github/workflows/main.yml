name: Export terms to POEditor

on:
  push:
    branches:
      - main
    paths-ignore:
      - "locales/**"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: poeditor-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-terms:
    name: Build and upload translation terms
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      POEDITOR_PROJECT_ID: ${{ secrets.POEDITOR_PROJECT_ID }}
      POEDITOR_API_TOKEN: ${{ secrets.POEDITOR_API_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            gettext \
            git \
            pandoc

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          python -m pip install \
            nbsphinx \
            nbconvert \
            nbformat \
            poeditor

      - name: Fetch notebooks
        run: make fetchnotebooks

      - name: Build documentation tools
        run: make buildtools

      - name: Build Sphinx gettext catalogues
        env:
          GITHUB_ACTIONS: "1"
        run: |
          python -m sphinx \
            -E \
            -a \
            -T \
            -b gettext \
            . \
            _build/gettext

      - name: List generated POT files
        run: |
          echo "Generated POT files:"
          find _build/gettext -type f -name "*.pot" -print

      - name: Verify POT files exist
        run: |
          if ! find _build/gettext -type f -name "*.pot" -print -quit \
            | grep -q .; then
            echo "No POT files were generated."
            exit 1
          fi

      - name: Merge POT files
        run: |
          find _build/gettext \
            -type f \
            -name "*.pot" \
            -print0 \
            | sort -z \
            | xargs -0 msgcat \
                --use-first \
                --output-file=_build/docs.pot

          test -s _build/docs.pot

          echo "Merged catalogue:"
          ls -lh _build/docs.pot

      - name: Upload POT artifact
        uses: actions/upload-artifact@v4
        with:
          name: digital-earth-africa-docs-pot
          path: _build/docs.pot
          if-no-files-found: error
          retention-days: 14

      - name: Upload terms to POEditor
        run: python upload_terms.py
