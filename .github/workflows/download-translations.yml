name: Download translations from POEditor

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

concurrency:
  group: poeditor-download-translations
  cancel-in-progress: true

jobs:
  download-translations:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      POEDITOR_PROJECT_ID: ${{ secrets.POEDITOR_PROJECT_ID }}
      POEDITOR_API_TOKEN: ${{ secrets.POEDITOR_API_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download translations
        run: make fetchtranslation

      - name: Verify downloaded PO files
        run: |
          find locales/fr/LC_MESSAGES \
            -type f \
            -name "*.po" \
            -print

          if ! find locales/fr/LC_MESSAGES \
            -type f \
            -name "*.po" \
            -print -quit |
            grep -q .; then
            echo "No French PO files were downloaded."
            exit 1
          fi

      - name: Commit translation updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add locales/fr/LC_MESSAGES

          if git diff --cached --quiet; then
            echo "No translation updates were found."
          else
            git commit -m "Update French translations from POEditor"
            git push origin main
          fi
